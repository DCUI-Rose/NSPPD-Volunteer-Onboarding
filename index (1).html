<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NSPPD Medic Volunteer Onboarding</title>
<style>
  :root{
    --red: #C81212;
    --red-deep: #7A0C0C;
    --black: #0A0A0A;
    --charcoal: #161616;
    --line: #2B2B2B;
    --ink: #EDEDED;
  }

  *{ box-sizing: border-box; }

  body{
    margin:0;
    background: var(--black);
    background-image:
      radial-gradient(circle at 20% 0%, rgba(200,18,18,0.18), transparent 45%),
      radial-gradient(circle at 80% 100%, rgba(200,18,18,0.12), transparent 50%);
    font-family: 'Arial Black', Arial, Helvetica, sans-serif;
    color: var(--ink);
    padding: 0 16px 80px;
  }

  .wrap{
    max-width: 560px;
    margin: 0 auto;
  }

  .logo-banner{
    width: 100%;
    display:block;
    margin: 0 auto;
    border-bottom: 3px solid var(--red);
  }

  h1{
    font-size: 20px;
    letter-spacing: .04em;
    text-transform: uppercase;
    color: #fff;
    text-align: center;
    margin: 26px 0 4px;
  }

  .sub{
    text-align:center;
    font-size: 12px;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--red);
    font-family: Arial, Helvetica, sans-serif;
    font-weight: 700;
    margin-bottom: 28px;
  }

  form{
    background: var(--charcoal);
    border-top: 4px solid var(--red);
    border-radius: 4px;
    box-shadow: 0 10px 34px rgba(0,0,0,0.6);
    padding: 30px 26px;
  }

  .field{
    margin-bottom: 22px;
  }

  label{
    display:block;
    font-size: 13px;
    font-weight: 700;
    font-family: Arial, Helvetica, sans-serif;
    color: #fff;
    margin-bottom: 7px;
  }

  input[type=text], input[type=tel], select{
    width:100%;
    padding: 10px 11px;
    border: 1px solid var(--line);
    border-radius: 3px;
    background: #0F0F0F;
    font-family: Arial, Helvetica, sans-serif;
    font-size: 14.5px;
    color: var(--ink);
  }

  input:focus, select:focus{
    outline: 2px solid var(--red);
    outline-offset: 1px;
    border-color: var(--red);
  }

  .check-row, .radio-row{
    display:flex;
    gap: 18px;
    flex-wrap: wrap;
  }

  .check-row label, .radio-row label{
    display:flex;
    align-items:center;
    gap:6px;
    font-weight: 400;
    font-family: Arial, Helvetica, sans-serif;
    font-size: 14px;
    color: var(--ink);
    margin-bottom: 0;
  }

  .check-row input, .radio-row input{
    accent-color: var(--red);
  }

  button{
    width: 100%;
    padding: 13px;
    background: var(--red);
    color: #fff;
    border: none;
    border-radius: 3px;
    font-family: Arial, Helvetica, sans-serif;
    text-transform: uppercase;
    letter-spacing: .06em;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
  }

  button:hover{ background: var(--red-deep); }
  button:disabled{ opacity: .6; cursor: not-allowed; }

  .status{
    margin-top: 14px;
    padding: 11px 13px;
    border-radius: 3px;
    font-size: 13.5px;
    font-family: Arial, Helvetica, sans-serif;
    display:none;
  }

  .status.show{ display:block; }
  .status.ok{ background:#1E3320; color:#8FD19E; border:1px solid #2F4F32; }
  .status.err{ background:#3A1414; color:#F0A38A; border:1px solid #5C1E1E; }
</style>
</head>
<body>

<div class="wrap">
  <img class="logo-banner" src="LOGOnsppduk.jpg" alt="NSPPD UK Prayer Conference Medics">
  <h1>Medic Volunteer Onboarding</h1>
  <div class="sub">NSPPD UK &middot; Medics Department</div>

  <form id="onboardingForm">

    <div class="field">
      <label for="name">1. Name</label>
      <input type="text" id="name" name="name" required>
    </div>

    <div class="field">
      <label for="volunteerId">2. Volunteer ID Number</label>
      <input type="text" id="volunteerId" name="volunteerId" required>
    </div>

    <div class="field">
      <label for="whatsappPhone">3. Number that you've used to join the WhatsApp GC</label>
      <input type="tel" id="whatsappPhone" name="whatsappPhone" required>
    </div>

    <div class="field">
      <label for="profession">4. Profession</label>
      <select id="profession" name="profession" required>
        <option value="" disabled selected>Select one</option>
        <option>Doctor</option>
        <option>Nurse</option>
        <option>Carer</option>
        <option>First Aid Responder</option>
      </select>
    </div>

    <div class="field" id="specialtyLevelField" style="display:none;">
      <label for="specialtyLevel">5. Specialty level</label>
      <input type="text" id="specialtyLevel" name="specialtyLevel">
    </div>

    <div class="field">
      <label>6. How many conferences have you served as an NSPPD Medic? Select the years</label>
      <div class="check-row">
        <label><input type="checkbox" name="conferencesServed" value="2023"> 2023</label>
        <label><input type="checkbox" name="conferencesServed" value="2024"> 2024</label>
        <label><input type="checkbox" name="conferencesServed" value="2025"> 2025</label>
        <label><input type="checkbox" name="conferencesServed" value="None" id="noneOption"> None — first time serving</label>
      </div>
    </div>

    <div class="field">
      <label>7. Have you served as a Medic group lead in 2025?</label>
      <div class="radio-row">
        <label><input type="radio" name="groupLead2025" value="Yes" required> Yes</label>
        <label><input type="radio" name="groupLead2025" value="No" required> No</label>
        <label><input type="radio" name="groupLead2025" value="Assisted but not lead" required> Assisted but not lead</label>
      </div>
    </div>

    <div class="field">
      <label for="city">8. What city do you reside in?</label>
      <input type="text" id="city" name="city" required>
    </div>

    <div class="field">
      <label for="mobilityNeeds">9. Do you have mobility needs that we need to be aware of?</label>
      <input type="text" id="mobilityNeeds" name="mobilityNeeds" required>
    </div>

    <button type="submit" id="submitBtn">Submit</button>
    <div class="status" id="statusBox"></div>
  </form>
</div>

<script>
  const SHEET_ENDPOINT = "https://script.google.com/macros/s/AKfycbyPU7dDzmyYdN_u0TjO8F60aXxbh3Os_c9v_uMLJi9pu2TZjYTY-L_bnX5ggE2d-NKPQQ/exec";

  const professionSelect = document.getElementById('profession');
  const specialtyLevelField = document.getElementById('specialtyLevelField');
  const specialtyLevelInput = document.getElementById('specialtyLevel');

  function toggleSpecialtyLevel() {
    const val = professionSelect.value;
    if (val === 'Doctor' || val === 'Nurse') {
      specialtyLevelField.style.display = '';
      specialtyLevelInput.required = true;
    } else {
      specialtyLevelField.style.display = 'none';
      specialtyLevelInput.required = false;
      specialtyLevelInput.value = '';
    }
  }

  professionSelect.addEventListener('change', toggleSpecialtyLevel);
  toggleSpecialtyLevel();

  const noneOption = document.getElementById('noneOption');
  const yearCheckboxes = document.querySelectorAll('input[name="conferencesServed"]:not(#noneOption)');

  noneOption.addEventListener('change', () => {
    if (noneOption.checked) yearCheckboxes.forEach(cb => cb.checked = false);
  });
  yearCheckboxes.forEach(cb => {
    cb.addEventListener('change', () => {
      if (cb.checked) noneOption.checked = false;
    });
  });

  const form = document.getElementById('onboardingForm');
  const statusBox = document.getElementById('statusBox');
  const submitBtn = document.getElementById('submitBtn');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    statusBox.className = 'status';

    const data = new FormData(form);
    const years = data.getAll('conferencesServed');

    if (years.length === 0) {
      statusBox.textContent = "Please select at least one year in question 6.";
      statusBox.className = 'status err show';
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = 'Submitting…';

    const payload = {
      timestamp: new Date().toISOString(),
      name: data.get('name') || '',
      volunteerId: data.get('volunteerId') || '',
      whatsappPhone: data.get('whatsappPhone') || '',
      profession: data.get('profession') || '',
      specialtyLevel: data.get('specialtyLevel') || '',
      conferencesServed: years.join(', '),
      groupLead2025: data.get('groupLead2025') || '',
      city: data.get('city') || '',
      mobilityNeeds: data.get('mobilityNeeds') || ''
    };

    try {
      await fetch(SHEET_ENDPOINT, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify(payload)
      });
      statusBox.textContent = "Thank you — your registration has been received.";
      statusBox.className = 'status ok show';
      form.reset();
    } catch (err) {
      statusBox.textContent = "Something went wrong. Please try again.";
      statusBox.className = 'status err show';
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = 'Submit';
    }
  });
</script>

</body>
</html>
