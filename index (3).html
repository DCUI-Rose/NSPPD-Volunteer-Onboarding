<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NSPPD UK Medics</title>
<style>
  :root{
    --red: #C81212;
    --red-deep: #7A0C0C;
    --black: #0A0A0A;
    --charcoal: #161616;
    --line: #2B2B2B;
    --ink: #EDEDED;
  }

  *{ box-sizing: border-box; }

  body{
    margin:0;
    background: var(--black);
    background-image:
      radial-gradient(circle at 20% 0%, rgba(200,18,18,0.18), transparent 45%),
      radial-gradient(circle at 80% 100%, rgba(200,18,18,0.12), transparent 50%);
    font-family: 'Arial Black', Arial, Helvetica, sans-serif;
    color: var(--ink);
    padding: 0 16px 80px;
    min-height: 100vh;
  }

  .wrap{
    max-width: 560px;
    margin: 0 auto;
  }

  .logo-banner{
    width: 100%;
    display:block;
    margin: 0 auto;
    border-bottom: 3px solid var(--red);
  }

  h1{
    font-size: 20px;
    letter-spacing: .04em;
    text-transform: uppercase;
    color: #fff;
    text-align: center;
    margin: 26px 0 4px;
  }

  .sub{
    text-align:center;
    font-size: 12px;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--red);
    font-family: Arial, Helvetica, sans-serif;
    font-weight: 700;
    margin-bottom: 28px;
  }

  .card-links{
    background: var(--charcoal);
    border-top: 4px solid var(--red);
    border-radius: 4px;
    box-shadow: 0 10px 34px rgba(0,0,0,0.6);
    padding: 30px 26px;
  }

  .link-card{
    display:block;
    background:#0F0F0F;
    border:1px solid var(--line);
    border-radius:4px;
    padding:20px 18px;
    margin-bottom:16px;
    text-decoration:none;
    color: var(--ink);
    transition: border-color .15s ease;
  }
  .link-card:last-child{ margin-bottom:0; }
  .link-card:hover{ border-color: var(--red); }

  .link-card .tag{
    display:inline-block;
    font-size:11px;
    letter-spacing:.1em;
    text-transform:uppercase;
    color: var(--red);
    font-family: Arial, Helvetica, sans-serif;
    font-weight:700;
    margin-bottom:8px;
  }

  .link-card h2{
    margin:0 0 6px;
    font-size:16px;
    color:#fff;
    text-transform:uppercase;
    letter-spacing:.03em;
  }

  .link-card p{
    margin:0;
    font-size:13.5px;
    font-family: Arial, Helvetica, sans-serif;
    color:#B8B8B8;
    line-height:1.5;
  }

  .link-card .arrow{
    float:right;
    color: var(--red);
    font-family: Arial, Helvetica, sans-serif;
    font-weight:700;
  }

  footer{
    text-align:center;
    font-family: Arial, Helvetica, sans-serif;
    font-size:11.5px;
    color:#6B6B6B;
    margin-top:24px;
  }
</style>
</head>
<body>

<div class="wrap">
  <img class="logo-banner" src="LOGOnsppduk.jpg" alt="NSPPD UK Prayer Conference Medics">
  <h1>Medic Volunteer Hub</h1>
  <div class="sub">NSPPD UK &middot; Medics Department</div>

  <div class="card-links">
    <a class="link-card" href="onboarding.html">
      <span class="tag">Step 1</span>
      <h2>Volunteer Onboarding <span class="arrow">&rarr;</span></h2>
      <p>New or returning? Register your details for this year's conference.</p>
    </a>
    <a class="link-card" href="nsppd-elearning.html">
      <span class="tag">Step 2</span>
      <h2>General Conduct Training <span class="arrow">&rarr;</span></h2>
      <p>Go through the conduct training, take the short quiz, and sign your declaration.</p>
    </a>
  </div>

  <footer>NSPPD UK 2026 Medical Unit</footer>
</div>

</body>
</html>
